[project]
name = "qr-code-pixel-art"
version = "1.0.0"
description = "Convert your pixelart into qr code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "qrcode[pil]>=8.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/interfaces",
    "src/image_processing",
    "src/qr_code",
]
